[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-from-scratch"
version = "0.1.0"
description = "Educational GCN and GAT implementations with a NumPy reverse-mode autograd engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Bruna Campos Guedes"}
]
keywords = [
  "graph-neural-networks",
  "graph-convolutional-network",
  "graph-attention-network",
  "autograd",
  "numpy",
  "cora"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.23,<2.3; python_version < '3.11'",
  "numpy>=1.23; python_version >= '3.11'",
  "scipy>=1.9,<1.16; python_version < '3.11'",
  "scipy>=1.9; python_version >= '3.11'",
  "matplotlib>=3.6,<3.11; python_version < '3.11'",
  "matplotlib>=3.6; python_version >= '3.11'"
]

[project.optional-dependencies]
dev = [
  "pytest>=7"
]
notebooks = [
  "jupyter>=1.0",
  "scikit-learn>=1.1"
]

[project.urls]
Homepage = "https://github.com/brunacg/gnn-from-scratch"
Repository = "https://github.com/brunacg/gnn-from-scratch"

[tool.setuptools.packages.find]
include = ["gnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
